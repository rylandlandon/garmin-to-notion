name: Sync Garmin to Notion

on:
  schedule:
    - cron: '23 1 * * *' # Daily, evening (off the hour, when GitHub is less busy)
    - cron: '7 15 * * *' # Daily, morning (picks up last night's sleep before the brief)
  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 10
      BACKFILL_DAYS:
        description: 'Days of steps and sleep history to sync'
        type: number
        default: 1
env:
  TZ: 'America/Toronto'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Run script
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_PR_DB_ID: ${{ secrets.NOTION_PR_DB_ID }}
          NOTION_STEPS_DB_ID: ${{ secrets.NOTION_STEPS_DB_ID }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '10' }}
          BACKFILL_DAYS: ${{ inputs.BACKFILL_DAYS || '1' }}
          TZ: 'America/Toronto'
        run: |
          uv run python -m src.workflows.garmin-activities
          uv run python -m src.workflows.personal-records
          uv run python -m src.workflows.daily-steps
          uv run python -m src.workflows.sleep-data
